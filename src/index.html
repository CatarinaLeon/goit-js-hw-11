<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixQuery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.0.0/modern-normalize.min.css"
    integrity="sha512-ISS7cAi1PEhQ8jnbJpJZMd29NlhNj4AWYyLOSp2CE/CsHxTCu+r+t0D2yoJudVrd0/8fTVPUVDzY5Tvli75u/g=="
    crossorigin="anonymous" />
</head>

<body>
  <header class="header">
    <a class="header-logo" href="/">
      <svg class="header-logo-icon" width="30px" height="30px">
        <use href="./images/picture-mount-sun.svg" width="30px" height="30px"></use>
      </svg>
      PixQuery
    </a>
    <h1 class="header-title">Inspiration in every image</h1>
    <form class="header-form" id="search-form">
      <input class="header-form-seach" type="text" name="searchQuery" autocomplete="off"
        placeholder="Search images..." />
      <button class="header-form-btn" type="submit">Search</button>
    </form>
  </header>
  <main>
    <div class="main-gif"></div>
    <div class="gallery"></div>
    <button type="button" class="load-more">Load more</button>
  </main>
  <footer class="footer">
    <p class="footer-text" id="copyright">©2025 All rights reserved</p>
    <a href="https://github.com/CatarinaLeon" class="footer-link">Catarina Leon</a>
  </footer>
  <script src="./index.js"></script>
</body>

</html>
